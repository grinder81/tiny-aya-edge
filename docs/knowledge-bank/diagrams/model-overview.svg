<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="Tiny Aya from text to next-token probabilities">
<title>Tiny Aya from text to next-token probabilities</title>
<desc>Checkpoint dimensions and operations; a schematic, not a measured execution trace.</desc>
<rect width="1000" height="760" fill="white"/>
<text x="40" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#17324d">Tiny Aya from text to next-token probabilities</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526678">Checkpoint dimensions and operations; a schematic, not a measured execution trace.</text>
<rect x="40" y="140" width="240" height="100" rx="12" fill="#e9f2ff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="160.0" y="182.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">Text to token IDs</text>
<text x="160.0" y="211.3" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17324d">Vocabulary: 262,144</text>
<rect x="335" y="140" width="300" height="100" rx="12" fill="#e6f5ee" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="485.0" y="182.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">Embedding lookup E</text>
<text x="485.0" y="211.3" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17324d">One 2,048-feature vector</text>
<rect x="690" y="140" width="270" height="100" rx="12" fill="#e9f2ff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="825.0" y="182.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">36 decoder blocks</text>
<text x="825.0" y="211.3" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17324d">Parallel attention + MLP</text>
<polyline points="280,190 335,190" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="335.00,190.00 324.96,194.49 324.96,185.51" fill="#17324d"/>
<polyline points="635,190 690,190" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="690.00,190.00 679.96,194.49 679.96,185.51" fill="#17324d"/>
<polyline points="825,240 825,315" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="825.00,315.00 820.51,304.96 829.49,304.96" fill="#17324d"/>
<rect x="40" y="315" width="920" height="130" rx="12" fill="#eeeaff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="500.0" y="358.46" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#17324d">Nine repeated groups of four blocks</text>
<text x="500.0" y="386.46" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17324d">Local + RoPE  |  Local + RoPE  |  Local + RoPE  |  Global, no explicit RoPE</text>
<text x="500.0" y="414.46" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17324d">Causal attention throughout; local window 4,096; configured context 8,192</text>
<polyline points="160,445 160,535" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="160.00,535.00 155.51,524.96 164.49,524.96" fill="#17324d"/>
<rect x="40" y="535" width="240" height="100" rx="12" fill="#e9f2ff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="160.0" y="577.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">Final LayerNorm</text>
<text x="160.0" y="606.3" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17324d">Width: 2,048</text>
<rect x="335" y="535" width="300" height="100" rx="12" fill="#e6f5ee" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="485.0" y="577.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">Shared output matrix E</text>
<text x="485.0" y="606.3" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17324d">262,144 vocabulary scores</text>
<rect x="690" y="535" width="270" height="100" rx="12" fill="#e9f2ff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="825.0" y="577.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">Softmax</text>
<text x="825.0" y="606.3" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17324d">Next-token probabilities</text>
<polyline points="280,585 335,585" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="335.00,585.00 324.96,589.49 324.96,580.51" fill="#17324d"/>
<polyline points="635,585 690,585" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="690.00,585.00 679.96,589.49 679.96,580.51" fill="#17324d"/>
<text x="40" y="697" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#17324d">The same stored E supplies input lookup and output projection; runtime copies may differ.</text>
</svg>
