<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="The gated feed-forward network">
<title>The gated feed-forward network</title>
<desc>The up and gate projections meet in an elementwise product.</desc>
<rect width="1000" height="800" fill="white"/>
<text x="40" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#17324d">The gated feed-forward network</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526678">The up and gate projections meet in an elementwise product.</text>
<rect x="370" y="135" width="260" height="75" rx="12" fill="#e9f2ff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="500.0" y="179.3" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17324d">Normalized input x: 2,048</text>
<rect x="55" y="315" width="360" height="110" rx="12" fill="#eeeaff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="235.0" y="349.12" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#17324d">Gate projection -&gt; SiLU</text>
<text x="235.0" y="376.12" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17324d">W_gate: 11,008 x 2,048</text>
<text x="235.0" y="403.12" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17324d">11,008 nonlinear gate values</text>
<rect x="585" y="315" width="360" height="110" rx="12" fill="#e6f5ee" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="765.0" y="349.12" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#17324d">Up projection</text>
<text x="765.0" y="376.12" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17324d">W_up: 11,008 x 2,048</text>
<text x="765.0" y="403.12" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17324d">11,008 intermediate features</text>
<polyline points="500,210 500,255 235,255 235,315" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="235.00,315.00 230.51,304.96 239.49,304.96" fill="#17324d"/>
<polyline points="500,255 765,255 765,315" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="765.00,315.00 760.51,304.96 769.49,304.96" fill="#17324d"/>
<rect x="355" y="505" width="290" height="75" rx="12" fill="#fff0d9" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="500.0" y="548.96" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#17324d">Elementwise product g * u</text>
<polyline points="235,425 235,542 355,542" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="355.00,542.00 344.96,546.49 344.96,537.51" fill="#17324d"/>
<polyline points="765,425 765,542 645,542" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="645.00,542.00 655.04,537.51 655.04,546.49" fill="#17324d"/>
<polyline points="500,580 500,645" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="500.00,645.00 495.51,634.96 504.49,634.96" fill="#17324d"/>
<rect x="280" y="645" width="440" height="95" rx="12" fill="#e9f2ff" stroke="#b5c6d6" stroke-width="1.5"/>
<text x="500.0" y="685.12" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#17324d">Down projection: 2,048 x 11,008</text>
<text x="500.0" y="712.12" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17324d">Returns 2,048 features to residual addition</text>
<text x="40" y="781" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#17324d">Each matrix: 22,544,384 parameters. The gate is not a binary switch.</text>
</svg>
